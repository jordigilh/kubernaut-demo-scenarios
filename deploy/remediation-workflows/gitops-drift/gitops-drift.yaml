apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-revert-v2-runner
  namespace: kubernaut-workflows
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: git-revert-v2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: git-revert-v2-runner
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: git-revert-v2
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: git-revert-v2-runner
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: git-revert-v2
subjects:
  - kind: ServiceAccount
    name: git-revert-v2-runner
    namespace: kubernaut-workflows
roleRef:
  kind: ClusterRole
  name: git-revert-v2-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: kubernaut.ai/v1alpha1
kind: RemediationWorkflow
metadata:
  name: git-revert-v2
  namespace: kubernaut-system
spec:
  # GitOps Revert Workflow Schema - Job Backend (BR-WORKFLOW-004)
  # Scenario: #125 -- GitOps drift remediation (ArgoCD + Gitea)
  version: "1.6.4"
  description:
    what: "Reverts a known bad source commit in a GitOps-managed repository, including PR merge commits, to restore a known-good parent"
    whenToUse: "When a GitOps-managed workload is crashing because a specific bad source commit is identified, its first parent is known to be healthy, and ArgoCD/Flux will reconcile the reverted state. Use this instead of PatchConfiguration or RollbackDeployment only when the source commit is the established cause."
    whenNotToUse: "When no specific bad source commit and known-good parent are established, when the failure is runtime drift or resource growth without a bad commit, or when the environment is not GitOps-managed -- use a more appropriate workflow or require human review"
    preconditions: "ArgoCD or Flux is active, the repository is accessible, a specific bad commit is identified, and its first parent is verified as a healthy desired state"
  
  actionType: GitRevertCommit
  
  labels:
    severity: [critical, high]
    environment: [staging, production]
    component: [v1/ConfigMap, apps/v1/Deployment]
    priority: "*"
    cluster: ["*"]
  
  detectedLabels:
    gitOpsTool: "*"
  
  execution:
    engine: job
    serviceAccountName: git-revert-v2-runner
    # GitOps credentials live on the hub: this workflow always executes on
    # the hub cluster, decoupled from the signal's origin cluster
    # (kubernaut#2326). Overridden at seed time by FLEET_EXECUTION_CLUSTER_ID
    # for environments whose hub id is not "hub". Single-cluster deployments
    # run it locally: non-fleet WE ignores the id (kubernaut#2378).
    clusterId: hub
    bundle: quay.io/kubernaut-cicd/test-workflows/git-revert-job@sha256:19a253d2ad2d537303bfd876dd7dbe23d96f585008071b809075e94d12041a4d

  dependencies:
    secrets:
      - name: gitea-repo-creds

  parameters:
    - name: TARGET_RESOURCE_NAMESPACE
      type: string
      required: true
      description: "Namespace of the affected workload"
    - name: TARGET_RESOURCE_NAME
      type: string
      required: true
      description: "Name of the Deployment (for verification)"
    - name: TARGET_RESOURCE_KIND
      type: string
      required: true
      description: "Must be Deployment"
