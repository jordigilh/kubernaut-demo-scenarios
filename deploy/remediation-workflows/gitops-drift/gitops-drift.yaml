apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-revert-v2-runner
  namespace: kubernaut-workflows
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: git-revert-v2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: git-revert-v2-runner
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: git-revert-v2
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: git-revert-v2-runner
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: git-revert-v2
subjects:
  - kind: ServiceAccount
    name: git-revert-v2-runner
    namespace: kubernaut-workflows
roleRef:
  kind: ClusterRole
  name: git-revert-v2-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: kubernaut.ai/v1alpha1
kind: RemediationWorkflow
metadata:
  name: git-revert-v2
  namespace: kubernaut-system
spec:
  # GitOps Revert Workflow Schema - Job Backend (BR-WORKFLOW-004)
  # Scenario: #125 -- GitOps drift remediation (ArgoCD + Gitea)
  version: "1.6.4"
  description:
    what: "Reverts the current synchronized source revision in a GitOps-managed repository, including delayed workload regressions and PR merge commits, to restore the previous desired state"
    whenToUse: "When a GitOps-managed workload has a failure or recurrence that is plausibly caused by a recent desired-state or version change, including delayed regressions after a rollout or repeated in-cluster remediations that GitOps would overwrite. The execution Job discovers the ArgoCD/Flux-synchronized revision and validates a previously synchronized parent before pushing."
    whenNotToUse: "When evidence attributes the failure to infrastructure or an external dependency rather than the GitOps-managed workload, including node, control-plane, network, storage, cluster-capacity, or external-service failures; when the environment is not GitOps-managed; or when policy prohibits source rollback. Do not exclude solely because the exact application cause or source diff is unknown; execution validation fails closed if the synchronized revision or parent is unsafe."
    preconditions: "An ArgoCD or Flux application is active and reports a synchronized source revision, the repository is accessible, the source branch still points to that revision, and its first parent was previously synchronized as desired state."
  
  actionType: GitRevertCommit
  
  labels:
    severity: [critical, high]
    environment: [staging, production]
    component: [v1/ConfigMap, apps/v1/Deployment]
    priority: "*"
    cluster: ["*"]
  
  detectedLabels:
    gitOpsTool: "*"
  
  execution:
    engine: job
    serviceAccountName: git-revert-v2-runner
    # GitOps credentials live on the hub: this workflow always executes on
    # the hub cluster, decoupled from the signal's origin cluster
    # (kubernaut#2326). Overridden at seed time by FLEET_EXECUTION_CLUSTER_ID
    # for environments whose hub id is not "hub". Single-cluster deployments
    # run it locally: non-fleet WE ignores the id (kubernaut#2378).
    clusterId: hub
    bundle: quay.io/kubernaut-cicd/test-workflows/git-revert-job@sha256:19a253d2ad2d537303bfd876dd7dbe23d96f585008071b809075e94d12041a4d

  dependencies:
    secrets:
      - name: gitea-repo-creds

  parameters:
    - name: TARGET_RESOURCE_NAMESPACE
      type: string
      required: true
      description: "Namespace of the affected workload"
    - name: TARGET_RESOURCE_NAME
      type: string
      required: true
      description: "Name of the affected workload resource (for verification)"
    - name: TARGET_RESOURCE_KIND
      type: string
      required: true
      description: "Kind of the affected workload resource"
