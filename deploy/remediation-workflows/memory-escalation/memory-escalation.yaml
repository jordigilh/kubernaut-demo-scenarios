apiVersion: v1
kind: ServiceAccount
metadata:
  name: increase-memory-limits-v1-runner
  namespace: kubernaut-workflows
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: increase-memory-limits-v1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: increase-memory-limits-v1-runner
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: increase-memory-limits-v1
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: increase-memory-limits-v1-runner
  labels:
    kubernaut.ai/workflow-runner: "true"
    kubernaut.ai/workflow: increase-memory-limits-v1
subjects:
  - kind: ServiceAccount
    name: increase-memory-limits-v1-runner
    namespace: kubernaut-workflows
roleRef:
  kind: ClusterRole
  name: increase-memory-limits-v1-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: kubernaut.ai/v1alpha1
kind: RemediationWorkflow
metadata:
  name: increase-memory-limits-v1
  namespace: kubernaut-system
spec:
  # Increase Memory Limits Workflow Schema - Job Backend (BR-WORKFLOW-004)
  # Scenario: Memory escalation -- increase limits to prevent OOMKill
  version: "1.6.2"
  description:
    what: "Increases the memory limits of a deployment's containers to prevent OOMKill events. Doubles the current memory limit by default."
    whenToUse: "When a Deployment's live resource limits are the authoritative remediation surface and its containers are being OOMKilled (ContainerOOMKilling signal or OOMKilled termination reason) because the memory limit is too low. This is a first-pass direct-cluster mitigation; when the Deployment itself is reconciled from ArgoCD/Flux desired state, use the reviewed GitOps IncreaseMemoryLimits workflow. A GitOps-associated incident may still require a different workflow when its target is a controller-generated dependency rather than the GitOps source-of-truth Deployment."
    whenNotToUse: >-
      When this workflow would directly mutate a Deployment field reconciled from
      ArgoCD, Flux, or another controller and the next reconciliation would
      overwrite the change; use the source-of-truth or controller-aware workflow
      instead. Do not infer that every incident associated with a GitOps resource
      requires a Git revert: generated dependencies can have a different
      authoritative remediation target. Also do not use when the issue is a
      namespace ResourceQuota constraint — increasing individual pod limits cannot
      resolve quota exhaustion and may worsen it by requesting more memory per pod
      against a fixed quota ceiling; in quota exhaustion cases, escalate to human
      review for quota policy adjustment.
    preconditions: "The deployment exists and containers have memory limits set. The node has sufficient allocatable memory for the increased limit."
  
  actionType: IncreaseMemoryLimits
  
  labels:
    severity: [critical, high]
    environment: [production, staging]
    component: [apps/v1/Deployment]
    priority: "*"
    cluster: ["*"]
  
  execution:
    engine: job
    serviceAccountName: increase-memory-limits-v1-runner
    bundle: quay.io/kubernaut-cicd/test-workflows/increase-memory-limits-job@sha256:5d11d2d7ac13552cc6fc8e331c659adc6b1d6bcd7427e4c15369771c80f23966
  parameters:
    - name: TARGET_RESOURCE_NAMESPACE
      type: string
      required: true
      description: "Namespace of the affected deployment"
    - name: TARGET_RESOURCE_NAME
      type: string
      required: true
      description: "Name of the deployment to patch"
    - name: TARGET_RESOURCE_KIND
      type: string
      required: true
      description: "Must be Deployment"
    - name: MEMORY_INCREASE_FACTOR
      type: string
      required: false
      default: "2"
      description: "Multiplier for current memory limit (e.g., 2 means double)"
