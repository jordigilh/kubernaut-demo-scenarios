          TARGET_RESOURCE_NAME: true
          TARGET_RESOURCE_NAMESPACE: true
        executionBundle: quay.io/kubernaut-cicd/test-workflows/helm-rollback-job@sha256:d7739e5bcf1270e32ec36ed7a6a528fe99e4d12a3fa2d55d9eaaddee2a107d25
