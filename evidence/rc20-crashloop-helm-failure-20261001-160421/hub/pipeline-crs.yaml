    rcaResult:
      actionability: Actionable
      rootCause: The worker container crashes because the Helm-managed ConfigMap demo-storefront/worker-config
        contains the invalid nginx directive invalid_directive_that_breaks_nginx at
        line 11, causing nginx to exit with code 1. The failing deployment revision
        is unhealthy while the previous revision's pods are healthy.
      rootCauseAnalysis:
        contributingFactors:
        - Deployment revision 2 introduced a new configuration checksum; the previous
          healthy ReplicaSet uses a different checksum.
        - The invalid nginx configuration is mounted from ConfigMap worker-config
          at /etc/nginx/nginx.conf.
        - The rollout is degraded with 2 of 3 replicas available.
        remediationTarget:
          apiVersion: v1
          kind: ConfigMap
          name: worker-config
          namespace: demo-storefront
        severity: critical
        signalType: KubePodCrashLooping
        summary: The worker container crashes because the Helm-managed ConfigMap demo-storefront/worker-config
          contains the invalid nginx directive invalid_directive_that_breaks_nginx
          at line 11, causing nginx to exit with code 1. The failing deployment revision
          is unhealthy while the previous revision's pods are healthy.
