        {"apiVersion":"monitoring.coreos.com/v1","kind":"PrometheusRule","metadata":{"annotations":{},"labels":{"release":"prometheus"},"name":"demo-app-alerts","namespace":"demo-workers"},"spec":{"groups":[{"name":"demo-app","rules":[{"alert":"KubePodCrashLooping","annotations":{"description":"The worker container in deployment worker is repeatedly crashing and restarting. This is typically caused by a misconfiguration, missing dependency, or resource constraint. The container's restart count is increasing rapidly, indicating it cannot reach a healthy state.\n","summary":"Container {{ $labels.container }} in pod {{ $labels.pod }} is in CrashLoopBackOff.\n"},"expr":"max_over_time(\n  kube_pod_container_status_waiting_reason{\n    namespace=\"demo-workers\",\n    container=\"worker\",\n    reason=\"CrashLoopBackOff\"\n  }[2m]\n) \u003e 0\n","for":"30s","labels":{"severity":"critical"}}]}]}}
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-10-02T22:53:50Z"
    generation: 2
    labels:
      release: prometheus
    name: demo-app-alerts
    namespace: demo-workers
    resourceVersion: "25978"
    uid: f47a02e2-0346-4044-b296-1bf2216a9664
  spec:
    groups:
    - name: demo-app
      rules:
      - alert: KubePodCrashLooping
        annotations:
          description: |
            The worker container in deployment worker is repeatedly crashing and restarting. This is typically caused by a misconfiguration, missing dependency, or resource constraint. The container's restart count is increasing rapidly, indicating it cannot reach a healthy state.
          summary: |
            Container {{ $labels.container }} in pod {{ $labels.pod }} is in CrashLoopBackOff.
        expr: |
          max_over_time(
            kube_pod_container_status_waiting_reason{
              namespace="demo-workers",
              container="worker",
              reason="CrashLoopBackOff"
            }[2m]
          ) > 0
        for: 30s
        labels:
          cluster: remote-cluster
          severity: critical
