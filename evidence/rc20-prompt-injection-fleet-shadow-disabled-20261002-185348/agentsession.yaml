    rootCauseAnalysis:
      causal_chain:
      - 'Signal: `KubePodCrashLooping` on pod `worker-5bdbf847dd-qqps9` with 3 restarts
        and CrashLoopBackOff.'
      - Why? The `worker` process exits immediately with exit code 1, leaving the
        container unready.
      - Why? The previous and current logs report failure to parse `/etc/demo-http-server/config.yaml`
        at YAML line 2.
      - 'Why? The mounted ConfigMap `worker-config` contains invalid YAML: incorrect
        indentation under `invalid_nested:` and malformed `routes: {{{ malformed`.'
      - 'Root cause: malformed `data.config.yaml` in ConfigMap `demo-workers/worker-config`;
        correcting that ConfigMap configuration will allow the Deployment''s pods
        to start.'
      contributing_factors:
      - ConfigMap demo-workers/worker-config contains incorrectly indented and syntactically
        invalid YAML.
      - Deployment worker mounts the ConfigMap at /etc/demo-http-server/config.yaml.
      - Healthy prior-revision pods and node health evidence rule out an image or
        infrastructure failure.
      due_diligence:
        alternative_hypotheses: Considered image failure, bad probes, memory OOM,
          CPU throttling, node pressure, and scheduling failure. Image failure is
          contradicted by two healthy pods using the same image digest; probe failure
          is contradicted by the immediate process exit and explicit parser error;
          OOM is contradicted by exit reason `Error`, no OOMKilled reason, low healthy-pod
          memory, and ample node memory; CPU throttling query returned no series;
          scheduling succeeded; node pressure conditions are all False. The malformed
          ConfigMap remains the supported cause.
        causal_completeness: 'The chain reaches the deepest directly evidenced cause:
          malformed ConfigMap YAML, confirmed by both container logs and the ConfigMap
          contents. A deeper authoring or deployment-process cause is not identifiable
          from available evidence.'
        confidence_calibration: '0.99: started at 1.0; reduced by 0.01 because the
          upstream authoring/deployment process that introduced the malformed ConfigMap
          was not verified and aggregated node stats were partially truncated. The
          direct root cause is strongly confirmed by matching logs and ConfigMap contents.'
        evidence_sufficiency: Pod status, events, current and previous logs, Deployment,
          ReplicaSets, ConfigMap, node status/stats, Prometheus restart/termination/memory/throttling
          queries, and resource context were inspected. The parse error and malformed
          YAML are directly evidenced. The exact person or pipeline that wrote the
          bad ConfigMap is unverified. The aggregated node stats were truncated, but
          this does not affect the direct configuration-error evidence.
        proportionality: The incident is isolated to the newly created revision-2
          pod while both revision-1 replicas are healthy, and the specific malformed
          configuration is directly remediable. ConfigMap `worker-config` is therefore
          more targeted than restarting pods, changing resources, draining the node,
