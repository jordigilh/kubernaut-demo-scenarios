- apiVersion: v1
  kind: Pod
  metadata:
    creationTimestamp: "2026-10-01T19:56:20Z"
    generateName: kubernaut-db-migration-
    generation: 1
    labels:
      app: db-migration
      batch.kubernetes.io/controller-uid: 7c78b402-4eb3-4a8f-8502-3c5e0f4a1794
      batch.kubernetes.io/job-name: kubernaut-db-migration
      controller-uid: 7c78b402-4eb3-4a8f-8502-3c5e0f4a1794
      job-name: kubernaut-db-migration
    name: kubernaut-db-migration-2gvzh
    namespace: kubernaut-system
    ownerReferences:
    - apiVersion: batch/v1
      blockOwnerDeletion: true
      controller: true
      kind: Job
      name: kubernaut-db-migration
      uid: 7c78b402-4eb3-4a8f-8502-3c5e0f4a1794
    resourceVersion: "91358"
    uid: 33ee2035-c265-4561-a8e8-b93168dd564e
  spec:
    containers:
    - command:
      - /bin/sh
      - -c
      - |
        set -e

        GOOSE_DBSTRING="host=$PGHOST user=$PGUSER password=$PGPASSWORD dbname=$PGDATABASE sslmode=$PGSSLMODE"

        # Issue #581: Fresh-vs-upgrade detection for future major-version baselines.
        # For minor releases, `goose up` handles both paths (fresh applies all;
        # upgrade applies only pending). Uncomment when a baseline file exists.
        #
        # if ! psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -tAc \
        #     "SELECT 1 FROM goose_db_version LIMIT 1" 2>/dev/null; then
        #   echo "==> Fresh install detected — applying baseline"
        #   psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -f /migrations/baseline_v2_schema.sql
        #   echo "==> Baseline applied, skipping numbered chain"
        #   exit 0
        # fi

        echo "==> Applying SQL migrations with goose (DD-012)"
        goose -dir /migrations postgres "$GOOSE_DBSTRING" up

        echo "==> Granting privileges..."
        psql -q <<'EOSQL'
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO slm_user;
        GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO slm_user;
        GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO slm_user;
        EOSQL
        echo "==> Migrations complete"
      env:
      - name: PGHOST
        value: postgresql.kubernaut-system.svc.cluster.local
      - name: PGPORT
        value: "5432"
      - name: PGUSER
        value: slm_user
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            key: POSTGRES_PASSWORD
            name: postgresql-secret
      - name: PGDATABASE
        value: action_history
      - name: PGSSLMODE
        value: require
      image: quay.io/kubernaut-ai/db-migrate:1.6.0-rc20
      imagePullPolicy: IfNotPresent
      name: migrate
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      volumeMounts:
      - mountPath: /migrations
        name: migrations
        readOnly: true
      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        name: kube-api-access-qmbxr
        readOnly: true
    dnsPolicy: ClusterFirst
    enableServiceLinks: true
    initContainers:
    - command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for PostgreSQL..."
        until psql -c 'SELECT 1' >/dev/null 2>&1; do
          echo "  PostgreSQL not ready, retrying in 2s..."
          sleep 2
