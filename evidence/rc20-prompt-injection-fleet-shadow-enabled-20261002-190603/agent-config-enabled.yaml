apiVersion: v1
data:
  config.yaml: |
    runtime:
      logging:
        level: "INFO"
      # GAP-14 / Issue #1519: OTel distributed tracing, opt-in (BYO-collector).
      # Shared across Gateway/DataStorage/KubernautAgent (top-level .Values.telemetry).
      # Empty endpoint + logSink=false (default) disables tracing entirely. Network
      # OTLP export is always TLS-protected.
      telemetry:
        endpoint: ""
        logSink: false
        tls:
          caFile: ""
          certFile: ""
          keyFile: ""
      server:
        address: "0.0.0.0"
        port: 8443
        healthAddr: ":8081"
        metricsAddr: ":9090"
        tls:
          certDir: "/etc/tls"
        # Issue #2276: ambient CA trust is now sourced from resolved config
        # (bootstrapAmbientCATrust, called before any outbound TLS handshake)
        # instead of a static Pod-spec env: TLS_CA_FILE entry -- eliminating the
        # class of bug where two independently chart-rendered components declare
        # the same env var name and the Pod spec is rejected.
        tlsCaFile: "/etc/tls-ca/ca.crt"
      audit:
        flushIntervalSeconds: 1.0
        bufferSize: 10000
        batchSize: 50
      # BR-PLATFORM-012, Issue #2275: secure-by-default pprof toggle.
      debug:
        pprofEnabled: false
    ai:
      llm:
        provider: "openai"
        reasoning:
          enabled: true
          effort: "none"
      investigation:
        maxTurns: 40
        resolvedConfidenceThreshold: 0.7
        inconclusiveConfidenceThreshold: 0.5
        safety:
          anomaly:
            maxTotalToolCalls: 30
      alignmentCheck:
        enabled: true
        timeout: 10s
        maxStepTokens: 500
        llm:
          provider: "openai"
          model: "gpt-5.6-luna"
          endpoint: "https://api.openai.com/v1"
          reasoning:
            enabled: true
            effort: "none"
    interactive:
      enabled: true
      sessionTTL: "30m"
      inactivityTimeout: "10m"
      # Issue #1737 gap found: default of 5 was too low even for realistic
      # production use, confirmed via full-suite E2E failing nearly every
      # interactive/MCP spec with "max_sessions: Maximum concurrent sessions
      # reached" from Ginkgo's own test parallelism alone (see values.yaml
      # comment for kubernautAgent.interactive.maxConcurrentSessions).
      maxConcurrentSessions: 50
      rateLimitPerUser: 20
      maxAnalyzingTimeout: "45m"
    integrations:
      dataStorage:
        url: "https://data-storage-service.kubernaut-system.svc.cluster.local:8080"
        healthUrl: "https://data-storage-service.kubernaut-system.svc.cluster.local:8080/readyz"
      tools:
        prometheus:
          url: "http://thanos-querier-svc.monitoring.svc.cluster.local:9090"
        alertmanager:
          url: "http://alertmanager-svc.monitoring.svc.cluster.local:9093"
      fleet:
        endpoint: "http://envoy-mcp-system-mcp-gateway-7ead7c3d.envoy-gateway-system.svc.cluster.local:8080/mcp"
        gatewayType: "eaigw"
        oauth2:
          enabled: true
          tokenURL: "https://keycloak.idp.svc.cluster.local:8443/realms/kubernaut-demo/protocol/openid-connect/token"
          credentialsSecretRef: "fleet-oauth2-creds"
          scopes:
            - "kube-mcp-server-audience"
          tlsCaFile: "/etc/tls-ca/ca.crt"
