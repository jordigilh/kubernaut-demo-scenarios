apiVersion: v1
data:
  policy.rego: "# Unified SignalProcessing Classification Policy\n#\n# Deploy via
    Helm:\n#   helm install kubernaut kubernaut/kubernaut \\\n#     --set-file signalprocessing.policies.content=deploy/defaults/signalprocessing-policy.rego\n#\n#
    Input schema (type-safe from Go):\n#   input.namespace.name         string\n#
    \  input.namespace.labels       map[string]string\n#   input.namespace.annotations
    \ map[string]string\n#   input.signal.severity        string\n#   input.signal.type
    \           string\n#   input.signal.source          string\n#   input.signal.labels
    \         map[string]string\n#   input.workload.kind          string\n#   input.workload.name
    \         string\n#   input.workload.labels        map[string]string\n#   input.workload.annotations
    \  map[string]string\n\npackage signalprocessing\n\nimport rego.v1\n\n# ==========
    Environment Classification (BR-SP-051) ==========\n# Reads the kubernaut.ai/environment
    namespace label, falling back to\n# well-known namespace names when no label is
    present.\n# Output values are PascalCase to match the SP CRD enum:\n#   \"Production\",
    \"Staging\", \"Development\", \"Test\", \"Unknown\"\n# Input comparisons use lower()
    for case-insensitive matching.\n\ndefault environment := {\"environment\": \"Unknown\",
    \"source\": \"default\"}\n\nenvironment := {\"environment\": \"Production\", \"source\":
    \"namespace-labels\"} if {\n    env := input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(env) == \"production\"\n}\nenvironment := {\"environment\": \"Staging\",
    \"source\": \"namespace-labels\"} if {\n    env := input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(env) == \"staging\"\n}\nenvironment := {\"environment\": \"Development\",
    \"source\": \"namespace-labels\"} if {\n    env := input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(env) == \"development\"\n}\nenvironment := {\"environment\": \"Test\",
    \"source\": \"namespace-labels\"} if {\n    env := input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(env) == \"test\"\n}\nenvironment := {\"environment\": \"Production\",
    \"source\": \"namespace-name\"} if {\n    not input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(input.namespace.name) == \"production\"\n}\nenvironment := {\"environment\":
    \"Production\", \"source\": \"namespace-name\"} if {\n    not input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(input.namespace.name) == \"prod\"\n}\nenvironment := {\"environment\":
    \"Staging\", \"source\": \"namespace-name\"} if {\n    not input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(input.namespace.name) == \"staging\"\n}\nenvironment := {\"environment\":
    \"Development\", \"source\": \"namespace-name\"} if {\n    not input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(input.namespace.name) == \"development\"\n}\nenvironment := {\"environment\":
    \"Development\", \"source\": \"namespace-name\"} if {\n    not input.namespace.labels[\"kubernaut.ai/environment\"]\n
    \   lower(input.namespace.name) == \"dev\"\n}\n\n# ========== Severity Normalization
    (BR-SP-105) ==========\n# Maps Prometheus/Alertmanager severity labels to kubernaut-standard
    values.\n# Extend the else-chain to support additional monitoring tools.\n\ndefault
    severity := \"unknown\"\n\nseverity := \"critical\" if { lower(input.signal.severity)
    == \"critical\" }\nseverity := \"high\"     if { lower(input.signal.severity)
    == \"high\" }\nseverity := \"warning\"  if { lower(input.signal.severity) == \"warning\"
    }\nseverity := \"info\"     if { lower(input.signal.severity) == \"info\" }\n\n#
    ========== Priority Assignment (BR-SP-070) ==========\n# Combines environment
    and severity to assign a priority bucket (P0–P3).\n\ndefault priority := {\"priority\":
    \"P3\", \"policy_name\": \"default\"}\n\npriority := {\"priority\": \"P0\", \"policy_name\":
    \"production-critical\"} if {\n    environment.environment == \"Production\"\n
    \   severity == \"critical\"\n}\npriority := {\"priority\": \"P1\", \"policy_name\":
    \"production-high\"} if {\n    environment.environment == \"Production\"\n    severity
    == \"high\"\n}\npriority := {\"priority\": \"P1\", \"policy_name\": \"staging-critical\"}
    if {\n    environment.environment == \"Staging\"\n    severity == \"critical\"\n}\npriority
    := {\"priority\": \"P2\", \"policy_name\": \"staging-any\"} if {\n    environment.environment
    == \"Staging\"\n    severity != \"critical\"\n}\n\n# ========== Custom Labels
    (BR-SP-102) ==========\n# Extracts operator-defined labels from namespace metadata
    for\n# workflow-context matching (team, tier).\n\ndefault labels := {}\n\nlabels
    := {\"team\": [team], \"tier\": [tier]} if {\n    team := input.namespace.labels[\"kubernaut.ai/team\"]\n
    \   team != \"\"\n    tier := input.namespace.labels[\"kubernaut.ai/tier\"]\n
    \   tier != \"\"\n}\n\nlabels := {\"team\": [team]} if {\n    team := input.namespace.labels[\"kubernaut.ai/team\"]\n
    \   team != \"\"\n    not input.namespace.labels[\"kubernaut.ai/tier\"]\n}\n\n\n\n#
    Cluster-scoped resources (Node, PV, ClusterRole) have no namespace.\n# The Go
    enricher serialises an empty NamespaceContext (name: \"\"), so the\n# standard
    `not input.namespace.name` guard is never true — Rego treats \"\"\n# as a defined
    value. These rules use an explicit `== \"\"` check instead.\nenvironment := {\"environment\":
    \"Production\", \"source\": \"workload-labels\"} if {\n\tinput.namespace.name
    == \"\"\n\tenv := input.workload.labels[\"kubernaut.ai/environment\"]\n\tlower(env)
    == \"production\"\n}\n\nenvironment := {\"environment\": \"Staging\", \"source\":
    \"workload-labels\"} if {\n\tinput.namespace.name == \"\"\n\tenv := input.workload.labels[\"kubernaut.ai/environment\"]\n\tlower(env)
    == \"staging\"\n}\n\nenvironment := {\"environment\": \"Development\", \"source\":
    \"workload-labels\"} if {\n\tinput.namespace.name == \"\"\n\tenv := input.workload.labels[\"kubernaut.ai/environment\"]\n\tlower(env)
    == \"development\"\n}\n\nenvironment := {\"environment\": \"Test\", \"source\":
    \"workload-labels\"} if {\n\tinput.namespace.name == \"\"\n\tenv := input.workload.labels[\"kubernaut.ai/environment\"]\n\tlower(env)
    == \"test\"\n}\n\n# Custom labels fallback: extract team/tier from workload labels
    when\n# namespace labels are absent (cluster-scoped resources).\nlabels := {\"team\":
    [team], \"tier\": [tier]} if {\n\tinput.namespace.name == \"\"\n\tteam := input.workload.labels[\"kubernaut.ai/team\"]\n\tteam
    != \"\"\n\ttier := input.workload.labels[\"kubernaut.ai/tier\"]\n\ttier != \"\"\n}\n\nlabels
    := {\"team\": [team]} if {\n\tinput.namespace.name == \"\"\n\tteam := input.workload.labels[\"kubernaut.ai/team\"]\n\tteam
    != \"\"\n\tnot input.workload.labels[\"kubernaut.ai/tier\"]\n}"
