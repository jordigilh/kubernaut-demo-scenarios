        {"apiVersion":"monitoring.coreos.com/v1","kind":"PrometheusRule","metadata":{"annotations":{},"labels":{"release":"prometheus"},"name":"demo-app-alerts","namespace":"demo-payments"},"spec":{"groups":[{"name":"demo-app","rules":[{"alert":"KubePodDisruptionBudgetAtLimit","annotations":{"description":"A PodDisruptionBudget in namespace {{ $labels.namespace }} currently permits zero voluntary disruptions. Cluster maintenance operations may be affected.\n","summary":"PDB {{ $labels.poddisruptionbudget }} in namespace {{ $labels.namespace }} has zero allowed disruptions.\n"},"expr":"max by (namespace, poddisruptionbudget) (\n  kube_poddisruptionbudget_status_pod_disruptions_allowed{\n    namespace=\"demo-payments\",\n    poddisruptionbudget=\"payment-service-pdb\"\n  } == 0\n  and\n  kube_poddisruptionbudget_status_expected_pods{\n    namespace=\"demo-payments\",\n    poddisruptionbudget=\"payment-service-pdb\"\n  }\n  ==\n  kube_poddisruptionbudget_status_current_healthy{\n    namespace=\"demo-payments\",\n    poddisruptionbudget=\"payment-service-pdb\"\n  }\n)\n","for":"30s","labels":{"namespace":"demo-payments","poddisruptionbudget":"payment-service-pdb","severity":"warning"}}]}]}}
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-10-03T03:09:22Z"
    generation: 2
    labels:
      release: prometheus
    name: demo-app-alerts
    namespace: demo-payments
    resourceVersion: "59296"
    uid: 279d0d6e-c3b4-4292-a916-4c519a704629
  spec:
    groups:
    - name: demo-app
      rules:
      - alert: KubePodDisruptionBudgetAtLimit
        annotations:
          description: |
            A PodDisruptionBudget in namespace {{ $labels.namespace }} currently permits zero voluntary disruptions. Cluster maintenance operations may be affected.
          summary: |
            PDB {{ $labels.poddisruptionbudget }} in namespace {{ $labels.namespace }} has zero allowed disruptions.
        expr: |
          max by (namespace, poddisruptionbudget) (
            kube_poddisruptionbudget_status_pod_disruptions_allowed{
              namespace="demo-payments",
              poddisruptionbudget="payment-service-pdb"
            } == 0
            and
            kube_poddisruptionbudget_status_expected_pods{
              namespace="demo-payments",
              poddisruptionbudget="payment-service-pdb"
            }
            ==
            kube_poddisruptionbudget_status_current_healthy{
              namespace="demo-payments",
              poddisruptionbudget="payment-service-pdb"
            }
          )
        for: 30s
        labels:
          cluster: remote-cluster
          namespace: demo-payments
          poddisruptionbudget: payment-service-pdb
          severity: warning
