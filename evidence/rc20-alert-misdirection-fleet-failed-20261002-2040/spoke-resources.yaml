        {"apiVersion":"monitoring.coreos.com/v1","kind":"PrometheusRule","metadata":{"annotations":{},"labels":{"release":"prometheus"},"name":"demo-app-alerts","namespace":"demo-backend"},"spec":{"groups":[{"name":"demo-app","rules":[{"alert":"KubePodCrashLooping","annotations":{"description":"The worker container in namespace {{ $labels.namespace }} is being terminated by the kernel OOM killer during startup initialization. The container's memory working set exceeds the configured 64Mi limit within seconds of starting, as the application attempts to load its full dependency graph into memory. The current memory request of 32Mi and limit of 64Mi are insufficient for this workload's startup footprint. Repeated OOMKill events are causing the pod to enter CrashLoopBackOff.\n","summary":"Container {{ $labels.container }} in pod {{ $labels.pod }} is in CrashLoopBackOff in namespace {{ $labels.namespace }}.\n"},"expr":"max_over_time(\n  kube_pod_container_status_waiting_reason{\n    namespace=\"demo-backend\",\n    container=\"worker\",\n    reason=\"CrashLoopBackOff\"\n  }[2m]\n) \u003e 0\n","for":"30s","labels":{"severity":"critical"}}]}]}}
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-10-03T00:40:27Z"
    generation: 2
    labels:
      release: prometheus
    name: demo-app-alerts
    namespace: demo-backend
    resourceVersion: "39919"
    uid: 054c69ae-e3ac-4ae3-b566-7f279b7176ef
  spec:
    groups:
    - name: demo-app
      rules:
      - alert: KubePodCrashLooping
        annotations:
          description: |
            The worker container in namespace {{ $labels.namespace }} is being terminated by the kernel OOM killer during startup initialization. The container's memory working set exceeds the configured 64Mi limit within seconds of starting, as the application attempts to load its full dependency graph into memory. The current memory request of 32Mi and limit of 64Mi are insufficient for this workload's startup footprint. Repeated OOMKill events are causing the pod to enter CrashLoopBackOff.
          summary: |
            Container {{ $labels.container }} in pod {{ $labels.pod }} is in CrashLoopBackOff in namespace {{ $labels.namespace }}.
        expr: |
          max_over_time(
            kube_pod_container_status_waiting_reason{
              namespace="demo-backend",
              container="worker",
              reason="CrashLoopBackOff"
            }[2m]
          ) > 0
        for: 30s
        labels:
          cluster: remote-cluster
          severity: critical
