apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-alerts
  namespace: demo-services
  labels:
    release: prometheus
spec:
  groups:
  - name: demo-app
    rules:
    - alert: ContainerOOMKilling
      expr: |
        kube_pod_container_status_last_terminated_reason{
          namespace="demo-services",
          reason="OOMKilled"
        } > 0
      for: 30s
      labels:
        severity: warning
      annotations:
        summary: >
          Container {{ $labels.container }} in pod {{ $labels.pod }}
          has been OOM-killed in namespace {{ $labels.namespace }}.
        description: >
          The container was terminated due to exceeding its memory limit.
          The pod may restart but will likely be killed again if the memory
          pressure persists.
    - alert: KubePodCrashLooping
      expr: |
        max_over_time(
          kube_pod_container_status_waiting_reason{
            namespace="demo-services",
            container="app",
            reason="CrashLoopBackOff"
          }[2m]
        ) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: >
          Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
          is in CrashLoopBackOff.
        description: >
          Container {{ $labels.container }} in pod {{ $labels.pod }}
          is restarting repeatedly. The container is exiting with a
          non-zero exit code.
