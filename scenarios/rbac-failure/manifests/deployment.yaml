apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-collector
  namespace: demo-monitoring
  labels:
    app: metrics-collector
    kubernaut.ai/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-collector
  template:
    metadata:
      labels:
        app: metrics-collector
    spec:
      serviceAccountName: metrics-collector
      containers:
        - name: metrics-collector
          # Portable kubectl-capable image, works on both vanilla k8s/Kind
          # and OCP (public registry, no per-platform overlay needed -- same
          # convention as other scenarios' quay.io/registry.k8s.io images).
          # Not the OCP-only internal registry the base manifest previously
          # hardcoded (image-registry.openshift-image-registry.svc:5000/...),
          # which never resolves on Kind/vanilla clusters; see README
          # "IN PROGRESS" note. Not bitnami/kubectl either -- Bitnami
          # deprecated its free catalog in 2025 (versioned tags gone, only
          # an unstable "latest" trial remains). alpine/k8s is community
          # maintained, multi-arch, and ships a shell (needed here).
          image: docker.io/alpine/k8s:1.30.0
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do kubectl get pods -n demo-monitoring > /dev/null 2>&1 && echo "$(date) OK" || echo "$(date) FORBIDDEN"; sleep 10; done
          readinessProbe:
            exec:
              command:
                - kubectl
                - auth
                - can-i
                - list
                - pods
                - -n
                - demo-monitoring
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
