apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../manifests
patches:
  - target:
      kind: Namespace
      name: demo-storefront
    patch: |
      - op: add
        path: /metadata/labels/openshift.io~1cluster-monitoring
        value: "true"
  - target:
      kind: PrometheusRule
      name: demo-app-alerts
    patch: |
      - op: replace
        path: /metadata/name
        value: demo-app-alerts-storefront
      - op: remove
        path: /metadata/labels/release
      - op: replace
        path: /metadata/namespace
        value: openshift-monitoring
      - op: replace
        path: /spec/groups/0/rules/0/expr
        value: "max_over_time(\n  kube_pod_container_status_waiting_reason{\n    namespace=\"demo-storefront\",\n    reason=\"CrashLoopBackOff\"\n  }[2m]\n) > 0\n"
