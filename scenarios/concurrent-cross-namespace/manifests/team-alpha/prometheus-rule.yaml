apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernaut-alpha-rules
  namespace: demo-team-alpha
  labels:
    release: prometheus
spec:
  groups:
  - name: kubernaut-team-alpha
    rules:
    - alert: KubePodCrashLooping
      expr: |
        max_over_time(
          kube_pod_container_status_waiting_reason{
            namespace="demo-team-alpha",
            container="worker",
            reason="CrashLoopBackOff"
          }[2m]
        ) > 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: >
          Container {{ $labels.container }} in pod {{ $labels.pod }} (team-alpha)
          is in CrashLoopBackOff.
        description: >
          Worker in team-alpha namespace is crashing. Team has high risk tolerance.
