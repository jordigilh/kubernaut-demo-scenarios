apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernaut-beta-rules
  namespace: demo-team-beta
  labels:
    release: prometheus
spec:
  groups:
  - name: kubernaut-team-beta
    rules:
    - alert: KubePodCrashLooping
      expr: |
        max_over_time(
          kube_pod_container_status_waiting_reason{
            namespace="demo-team-beta",
            container="worker",
            reason="CrashLoopBackOff"
          }[2m]
        ) > 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: >
          Container {{ $labels.container }} in pod {{ $labels.pod }} (team-beta)
          is in CrashLoopBackOff.
        description: >
          Worker in team-beta namespace is crashing. Team has low risk tolerance.
