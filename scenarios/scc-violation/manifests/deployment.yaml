apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-agent
  namespace: demo-agents
  labels:
    app: metrics-agent
    kubernaut.ai/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-agent
  template:
    metadata:
      labels:
        app: metrics-agent
    spec:
      securityContext:
        runAsNonRoot: true
        # Explicit UID for Kind: the busybox image has no USER directive, so
        # without this, kubelet rejects the pod ("container has runAsNonRoot
        # and image will run as root") since there's no OCP-style SCC to
        # auto-assign one. The OCP overlay strips this field back out so
        # OpenShift's restricted-v2 SCC keeps auto-assigning from the
        # namespace's allocated range, unchanged from before.
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: metrics-agent
        image: registry.k8s.io/e2e-test-images/busybox:1.29-2
        command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
