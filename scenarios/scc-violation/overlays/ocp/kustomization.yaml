apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../manifests
patches:
  - target:
      kind: Namespace
      name: demo-agents
    patch: |
      - op: add
        path: /metadata/labels/openshift.io~1cluster-monitoring
        value: "true"
  - target:
      kind: Deployment
      name: metrics-agent
    patch: |
      # Let OpenShift's restricted-v2 SCC auto-assign a UID from the
      # namespace's allocated range, as it always has -- the base manifest's
      # fixed runAsUser: 1000 is a Kind-only portability fix (no SCC there
      # to assign one), not something OCP should honor.
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
  - target:
      kind: PrometheusRule
      name: demo-app-alerts
    patch: |
      - op: replace
        path: /metadata/name
        value: demo-app-alerts-agents
      - op: remove
        path: /metadata/labels/release
      - op: replace
        path: /metadata/namespace
        value: openshift-monitoring
